# Overlay on the repo-root docker-compose.yml (devcontainer.json lists both).
# Adds the container you work in; MySQL and s3mock come from the root file.
services:
  dev:
    # Node 24.15 plus Chrome, maintained by the Cypress team. Everything else
    # (git, gh, sshd, Claude Code) is a devcontainer feature.
    image: cypress/browsers:node-24.15.0-chrome-148.0.7778.178-1-ff-151.0.2-edge-148.0.3967.83-1
    volumes:
      # The parent directory, so a linked worktree kept beside the main clone
      # can still find its repository.
      - ..:/workspaces:cached
    environment:
      # These win over apps/api/.env: dotenv and the Prisma CLI leave already
      # set variables alone, so the same .env works on the host and in here.
      DATABASE_URL: mysql://myuser:mypassword@mysql:3306/doenet
      DATABASE_HOST: mysql
      DATABASE_PORT: "3306"
      MEDIA_S3_LOCAL_ENDPOINT: http://s3mock:9090
      # The image caches Cypress under /root; use a path the node user owns.
      CYPRESS_CACHE_FOLDER: /home/node/.cache/Cypress
      NODE_OPTIONS: --max-old-space-size=4096
    depends_on:
      mysql:
        condition: service_healthy
      # s3mock is a slow-starting JVM and nothing needs it until the first
      # upload, so do not gate on its health.
      s3mock:
        condition: service_started
    init: true
    command: sleep infinity

  # Nothing is published on the host: the editor forwards ports from inside
  # the container, and this keeps the stack from colliding with a root
  # `docker compose up` in the same checkout.
  mysql:
    ports: !override []
  s3mock:
    ports: !override []
