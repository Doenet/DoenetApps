name: Reusable - Deploy Doenet Frontend to Amazon S3

on:
  workflow_call:
    inputs:
      deploy_ref:
        description: Git ref or SHA to deploy
        required: true
        type: string
      aws_region:
        description: AWS region for S3 and CloudFront
        required: true
        type: string
      gha_role:
        description: GitHub Actions role ARN
        required: true
        type: string
      aws_account_id:
        description: AWS account ID for bucket naming
        required: true
        type: string
      env_name:
        description: Deployment environment name
        required: true
        type: string
      build_mode:
        description: Frontend build mode
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.deploy_ref }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          audience: sts.amazonaws.com
          role-to-assume: ${{ inputs.gha_role }}
          role-session-name: app
          aws-region: ${{ inputs.aws_region }}

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Build the project
        run: |
          npm ci
          cd apps/app
          # Built into the bundle, so an open tab knows which build it is
          # running and can compare it to /version.json (reloadOnNewVersion).
          VITE_COMMIT_SHA="$(git rev-parse HEAD)" npm run build -- --mode ${{ inputs.build_mode }}

      - name: Stamp version.json
        env:
          REF: ${{ inputs.deploy_ref }}
        run: |
          # Ground-truth marker of what was deployed, curl-able at /version.json.
          # The `.json` extension matters: AppSpaRewriteFunction in
          # infra/cloudformation/s3-hosted.yml only rewrites dot-less paths to
          # index.html, so this passes through to S3 as a real object. Keep the
          # extension if that rewrite rule ever changes.
          jq -n --arg ref "$REF" --arg sha "$(git rev-parse HEAD)" \
            --arg builtAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{ref: $ref, sha: $sha, builtAt: $builtAt}' > apps/app/dist/version.json

      - name: Sync to S3
        run: |
          bucket=s3://${{ inputs.env_name }}-app-${{ inputs.aws_account_id }}-${{ inputs.aws_region }}
          # Vite's hashed bundles never change at a given URL, so cache them
          # for good. Upload them first, so the new index.html never points at
          # a bundle that isn't there yet. Old bundles are kept: a tab still
          # running an older build may lazy-load one of its chunks.
          aws s3 sync apps/app/dist/assets "$bucket/assets" \
            --cache-control "public, max-age=31536000, immutable"
          # Everything else (index.html, version.json, public/ files) keeps its
          # URL across deploys, so browsers and CloudFront must revalidate it.
          # Without a Cache-Control header, CloudFront keeps index.html for its
          # default TTL (a day) and browsers guess a lifetime from its age.
          aws s3 sync --delete apps/app/dist "$bucket" --exclude "assets/*" \
            --cache-control "no-cache"
          id=$(aws ssm get-parameter --name "/${{ inputs.env_name }}/app/DistributionId" --query "Parameter.Value" --output text)
          # AppSpaRewriteFunction rewrites every app route, including "/", to
          # /index.html before the cache lookup, so that is the cached key.
          aws cloudfront create-invalidation --distribution-id $id --paths "/index.html" "/version.json"
