name: Dev Deploy

on:
  workflow_dispatch:
    inputs:
      deploy_ref:
        description: Git ref or SHA to deploy
        required: false
        type: string
  # Main, once CI has passed on it (as prod-deploy.yml). A manual dispatch
  # deploys whatever ref it's given, without waiting for CI.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: ["main"]

permissions:
  contents: read
  id-token: write
  deployments: write

jobs:
  # Resolve the ref once and open a GitHub deployment so the repo's dev3
  # Environment always shows what is currently live on dev3. Bookkeeping is
  # best-effort and must never block an actual deploy.
  #
  # After CI, deploy only a commit that passed and is still the tip of main,
  # as prod-deploy.yml's `gate` does. Otherwise deploy_ref stays empty and
  # nothing deploys.
  create-deployment:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    outputs:
      deploy_ref: ${{ steps.ref.outputs.deploy_ref }}
      deployment_id: ${{ steps.open.outputs.deployment_id }}
    steps:
      - name: Resolve deploy ref
        id: ref
        env:
          EVENT: ${{ github.event_name }}
          INPUT_REF: ${{ inputs.deploy_ref }}
          SHA: ${{ github.sha }}
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            echo "deploy_ref=${INPUT_REF:-$SHA}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tip=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
          if [[ "$tip" == "$CI_SHA" ]]; then
            echo "deploy_ref=$CI_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipping $CI_SHA: main has moved on to $tip, whose CI run deploys it."
          fi

      - name: Checkout repository
        if: steps.ref.outputs.deploy_ref != ''
        uses: actions/checkout@v6

      - name: Open GitHub deployment
        id: open
        if: steps.ref.outputs.deploy_ref != ''
        uses: ./.github/actions/open-deployment
        with:
          environment: dev3
          environment-url: https://dev3.doenet.org
          ref: ${{ steps.ref.outputs.deploy_ref }}
          description: dev3 deploy

  # dev3's single deploy slot, shared with dev-deploy-pr.yml. On this job
  # rather than the workflow, so a run that deploys nothing (CI failed, or
  # not the tip) never cancels a deploy in progress.
  deploy:
    needs: create-deployment
    if: needs.create-deployment.outputs.deploy_ref != ''
    concurrency:
      group: dev-deploy
      cancel-in-progress: true
    uses: ./.github/workflows/reusable-deploy-env.yml
    with:
      deploy_ref: ${{ needs.create-deployment.outputs.deploy_ref }}
      env_name: dev3
    secrets: inherit

  record-deployment:
    needs: [create-deployment, deploy]
    if: always() && needs.create-deployment.outputs.deployment_id != ''
    runs-on: ubuntu-latest
    steps:
      # Read-only creds so finalize-deployment can ask whether dev3 is
      # actually awake before claiming a deployment is live. Best-effort:
      # never fails the job; without creds the lights read falls back to
      # treating dev3 as awake.
      - name: Configure AWS credentials
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v6
        with:
          audience: sts.amazonaws.com
          role-to-assume: arn:aws:iam::568298704244:role/github-actions-dev3
          role-session-name: dev3-deploy-status
          aws-region: us-east-2

      - name: Checkout repository
        uses: actions/checkout@v6

      # A deploy that a newer one cancelled (see `deploy`'s concurrency) isn't
      # what's live, and didn't fail on its own.
      - name: Mark a superseded deployment inactive
        if: needs.deploy.result == 'cancelled'
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_ID: ${{ needs.create-deployment.outputs.deployment_id }}
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/deployments/${DEPLOYMENT_ID}/statuses" \
            -f state=inactive \
            -f description="superseded by a newer dev3 deploy" \
            -f environment=dev3 \
            -f environment_url=https://dev3.doenet.org

      - name: Finalize GitHub deployment status
        if: needs.deploy.result != 'cancelled'
        uses: ./.github/actions/finalize-deployment
        with:
          deployment-id: ${{ needs.create-deployment.outputs.deployment_id }}
          environment: dev3
          environment-url: https://dev3.doenet.org
          backend-result: ${{ needs.deploy.outputs.backend_result }}
          frontend-result: ${{ needs.deploy.outputs.frontend_result }}
          site-result: ${{ needs.deploy.outputs.site_result }}
          lights-parameter: /dev3/doenet/lights
